#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that a GitHub Release with this tag is assumed to exist as a draft
# with the appropriate title/body, and will be undrafted for you.
#
# Three hand-added customizations `dist generate` doesn't know about, kept
# across regeneration via `dist-workspace.toml`'s `allow-dirty` (see its own
# comment for the procedure to follow when regenerating this file):
#
# - That draft is created by this file's own `create-draft-release` job
#   below, not by dist — see `dist-workspace.toml`'s `create-release`
#   comment for why. `host`'s `needs`/`if` depend on it.
# - `build-local-artifacts`'s own `Smoke test` step (ratect#32) runs the
#   just-built binary before it's uploaded.
# - `build-global-artifacts` gains an `Install cargo-cyclonedx` step, its
#   own `Generate SBOM` step (ratect#33), AND a third `target/distrib/
#   ${{ ... }}.cdx.json` line in that job's `Upload artifacts` `path:` —
#   all three, or the SBOM is generated and then silently thrown away
#   rather than uploaded.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Create the draft GitHub Release that `host` (below) uploads artifacts
  # to. Not generated by `dist generate` — see the file-level comment above.
  create-draft-release:
    needs: plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ fromJson(needs.plan.outputs.val).releases[0].app_version }}
      # dist's own `announcement_title` is just the tag string itself (e.g.
      # "ratect-compat/v0.28.0") for a Singular announcement — fine as an id,
      # not as a Release title a human reads.
      TITLE: ${{ fromJson(needs.plan.outputs.val).releases[0].app_name }} ${{ fromJson(needs.plan.outputs.val).releases[0].app_version }}
      # ROADMAP.md's versioning section marks every release `prerelease:
      # true` until a binary's own 1.0.0 — a rule about the binary's own
      # maturity, not the tagged version string's own SemVer shape, so
      # dist's `announcement_is_prerelease` (true only for a `-rc.1`-style
      # suffix) is the wrong source for it here.
      PRERELEASE_FLAG: "${{ startsWith(fromJson(needs.plan.outputs.val).releases[0].app_version, '0.') && '--prerelease' || '' }}"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Create draft release
        run: |
          python3 tools/changelog-section.py "$VERSION" > notes.md
          # Idempotent against a "re-run all jobs" retry that lands here a
          # second time: if the draft from a previous attempt already
          # exists, editing it (rather than erroring on `create`) lets
          # `host` retry cleanly. But never re-run this against a release
          # `host` already undrafted — passing `--draft` to `gh release
          # edit` unconditionally sets it, which would re-draft an already
          # published release out from under users.
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo "missing")"
          case "$is_draft" in
            true)
              gh release edit "$TAG" --draft --title "$TITLE" --notes-file notes.md $PRERELEASE_FLAG
              ;;
            missing)
              gh release create "$TAG" --draft --title "$TITLE" --notes-file notes.md $PRERELEASE_FLAG
              ;;
            *)
              echo "::error::release $TAG already exists and is not a draft; refusing to re-draft it" >&2
              exit 1
              ;;
          esac

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      # ratect#32: a cross-compilation or packaging mistake fails here,
      # before the artifact is uploaded, rather than only being discovered
      # by a user running a binary this job already published. Runs the
      # binary from inside the archive dist just built (not a separate
      # target/<triple>/ build output) on this matrix entry's own runner —
      # dist picks a native GitHub-hosted runner per target triple (the
      # `dist plan` manifest's own `runner` field: macos-14/macos-15-intel
      # for the two macOS targets, ubuntu-22.04/-arm for the three Linux
      # ones), so this genuinely executes the artifact, never something
      # QEMU- or Rosetta-emulated.
      - name: Smoke test
        shell: bash
        run: |
          executable_count="$(jq '[.artifacts[] | select(any(.assets[]?; .kind == "executable"))] | length' dist-manifest.json)"
          if [ "$executable_count" -ne 1 ]; then
            echo "::error::expected exactly 1 executable artifact in dist-manifest.json, found $executable_count" >&2
            exit 1
          fi
          archive="$(jq -r '.artifacts[] | select(any(.assets[]?; .kind == "executable")) | .path' dist-manifest.json)"
          bin="$(jq -r '.artifacts[] | select(any(.assets[]?; .kind == "executable")) | .assets[] | select(.kind == "executable") | .name' dist-manifest.json)"
          extract_dir="$(mktemp -d)"
          tar -xf "$archive" -C "$extract_dir"
          # The archive's real content sits one level down, in a directory
          # named after the archive itself (verified locally, not assumed).
          bin_path=""
          bin_match_count=0
          while IFS= read -r candidate; do
            bin_path="$candidate"
            bin_match_count=$((bin_match_count + 1))
          done < <(find "$extract_dir" -type f -name "$bin")
          if [ "$bin_match_count" -ne 1 ] || [ ! -x "$bin_path" ]; then
            echo "::error::expected exactly 1 executable named '$bin' under $extract_dir, found $bin_match_count" >&2
            exit 1
          fi
          "$bin_path" --version
          "$bin_path" --help
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # ratect#33: a CycloneDX SBOM for the released binary's actual
      # dependency tree — generated once here (not once per target in
      # build-local-artifacts above; the dependency graph cargo-cyclonedx
      # reports doesn't vary by target for this workspace, so a per-target
      # SBOM would just be five identical copies) and uploaded alongside
      # the binaries below. --describe binaries emits one file per
      # workspace binary crate (ratect and ratect-compat both, even though
      # only one is being released), so this selects the one that matches
      # the app actually being released and fails loudly, rather than
      # uploading nothing, if cargo-cyclonedx didn't write it or if a bare
      # (Unified-announcement) tag ever released more than one app at once
      # — see dist-workspace.toml's own note on why that form isn't blocked
      # outright. --spec-version 1.5 rather than the tool's own 1.3
      # default: broadly supported by current SBOM-consuming scanners while
      # staying one version behind the newest (1.6) spec, which tooling
      # support is less certain for. No best-effort fallback: a failure
      # here fails this job like any other step failure would.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Generate SBOM
        shell: bash
        env:
          APP_NAME: ${{ fromJson(needs.plan.outputs.val).releases[0].app_name }}
          RELEASE_COUNT: ${{ fromJson(needs.plan.outputs.val).releases | length }}
        run: |
          if [ "$RELEASE_COUNT" -ne 1 ]; then
            echo "::error::expected exactly 1 release in this announcement, found $RELEASE_COUNT — this step only generates an SBOM for releases[0]" >&2
            exit 1
          fi
          cargo cyclonedx --describe binaries --format json --spec-version 1.5
          sbom_path="$APP_NAME/${APP_NAME}_bin.cdx.json"
          if [ ! -f "$sbom_path" ]; then
            echo "::error::expected cargo-cyclonedx to write $sbom_path, it didn't" >&2
            exit 1
          fi
          mkdir -p target/distrib
          mv "$sbom_path" "target/distrib/$APP_NAME.cdx.json"
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            target/distrib/${{ fromJson(needs.plan.outputs.val).releases[0].app_name }}.cdx.json
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - create-draft-release
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine).
    # create-draft-release must succeed outright (never skipped when publishing) since host's own
    # "Create GitHub Release" step below uploads to the release it creates.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.create-draft-release.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # If we're editing a release in place, we need to upload things ahead of time
          gh release upload "${{ needs.plan.outputs.tag }}" artifacts/*

          gh release edit "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --draft=false

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
