name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Every `[`item`]` in a doc comment has to resolve. This repo puts a lot of
  # explanatory prose in doc comments deliberately (decisions/0006), and the
  # cross-references in it are the part that rots: rename or delete an item and
  # every link naming it breaks silently, because neither `cargo build` nor
  # `cargo clippy` reads them. A review caught one by hand; a grep for it
  # missed it, because the link text ends in a backtick before the bracket.
  #
  # Two checks, because one is not enough — an earlier version of this comment
  # called `cargo doc` "the check that can't miss it" and a review then found
  # the half it misses. Both run in tools/check-doc-links.py: `cargo doc`
  # under this job's `-D warnings`, then a comparison of the links written
  # with how they rendered, whose own first version was found to have three
  # holes of its own. Read its docstring before trusting it.
  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The script builds the docs itself, from cold, so a contributor's run
      # and this one read the same pages. Through `uv run`, as docs.yml runs
      # mdbook-ansi.py, so the script's own `requires-python` header picks
      # the Python and there is no second pin here to keep in step with it.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: No doc link renders as literal brackets
        run: uv run tools/check-doc-links.py

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      # `--all-features` turns on ratect-core's `schema` feature, whose tests
      # are what keep the committed schema/batect-config.schema.json in step
      # with the config types it's generated from.
      - run: cargo test --workspace --all-targets --all-features

  # Every other job runs on Linux, so without this nothing compiles the
  # `cfg(not(unix))` code: the non-Unix fallbacks for the host user,
  # signals, `build_ssh` agents and the Git include entry lock, and the tests
  # written for them (#839). A check, not a test run: it proves Windows
  # builds, not that it works there. `-D warnings` so code a `cfg(unix)` gate
  # leaves unused off Unix fails here, rather than accumulating where no other
  # job looks.
  # Not a required status check, like Claims and Worked Examples.
  windows-check:
    name: Windows Check
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  # At both ends of the range tools/ supports: the minimum its scripts'
  # `requires-python` headers declare (tools/test_python_minimum.py keeps
  # them agreeing on it), and the newest stable Python, which is where a
  # contributor's own `python3` drifts. One job, not a matrix: `Tools Tests`
  # is a required status check by that name, and a matrix renames its jobs.
  tools:
    name: Tools Tests
    # Not ubuntu-latest: setup-python publishes the 3.9 the refusal step below
    # runs on for 22.04 and 24.04 only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      # README.md's Documentation list mirrors docs/SUMMARY.md by hand; this
      # prints the diff when it has drifted (see the script's own docstring).
      - run: python3 tools/check-readme-docs-list.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          # The newest release, not the newest the runner image has cached.
          check-latest: true
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      # On a real older Python, which the unit tests can't stand in for: they
      # fake the version on a new interpreter, so a script using newer syntax
      # still reaches its version check there, where 3.9 would stop at a
      # SyntaxError first. 3.9 is stock macOS's `python3`.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Each tools/ script refuses Python 3.9 with its message
        run: |
          version=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          for script in $(git ls-files ':(glob)tools/*.py' ':!tools/test_*.py'); do
            if out=$(python3 "$script" 2>&1 </dev/null); then
              echo "$script ran on Python $version"
              exit 1
            fi
            case "$out" in
              *"or later, and this is $version"*"uv run $script"*) echo "$script: refused" ;;
              *) echo "$script: $out"; exit 1 ;;
            esac
          done

  # The `claims` documentation checks (decisions/0009, `claims.toml`) as a
  # backstop for the `pre-commit` hook, which only gates a commit made in a
  # clone where `pre-commit install` was run — a PR from anywhere else, or
  # from Renovate, would otherwise merge without `check-links`,
  # `check-citations` or `executable-claims` ever running against it.
  #
  # Pull requests only: `main` takes changes through nothing else, so a
  # `push` run would re-check what its PR already did.
  claims:
    name: Claims
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: `stale-claims` reads it, and the base ref the diff is
      # taken against has to exist.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `executable-claims` runs `cargo run`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The `rev` is read from `.pre-commit-config.yaml` rather than written
      # here a second time, so Renovate's bump of the hook moves this job too
      # and the two never check against different releases.
      - name: Check out the pinned claims release
        shell: bash
        run: |
          rev=$(awk '/repo: https:\/\/github.com\/or1can\/claims/ { found = 1 }
                     found && $1 == "rev:" { print $2; exit }' .pre-commit-config.yaml)
          if [ -z "$rev" ]; then
            echo "No rev for or1can/claims in .pre-commit-config.yaml — this search is broken."
            exit 1
          fi
          echo "claims $rev"
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$rev" \
            https://github.com/or1can/claims "$RUNNER_TEMP/claims"
      # `executable-claims` runs a `<!-- verify: -->` marker's command only
      # with an exact-string grant in the git-ignored `claims.local.toml`.
      # This is the same list `AGENTS.md`'s Tooling & CI section gives
      # contributors, and it adds no exposure: `cargo test` already runs the
      # PR's code. A new marker fails this job until its command is added
      # here, which is the point — someone has to look at what it runs. The
      # `[check-cli-flags]` denial is from the same list; `agents/claims.md` says why.
      - name: Grant the verify markers' commands
        run: |
          cat > claims.local.toml <<'EOF'
          [executable-claims]
          allowed = [
              "cargo run -q -p ratect-compat -- -f ratect-compat/tests/fixtures/smoke.yml --list-tasks",
              "cargo run -q -p ratect-compat -- -f examples/jvm/batect.yml --list-tasks",
              "cargo run -q -p ratect-compat -- -f examples/jvm/batect.yml -o quiet --list-tasks",
              "cargo run -q -p ratect -- tasks list -f examples/rust/ratect.toml",
              "cargo run -q -p ratect -- tasks list -f examples/getting-started/ratect.toml",
          ]

          [check-cli-flags]
          denied = ["tools/changelog-section.py --help"]
          EOF
      # The working tree against the base branch, i.e. the PR's whole change.
      # Exits 1 on a gate finding, 2 on an unparsable `claims.toml` and 3 on an
      # advisory finding that is neither fixed nor marked checked, all failing
      # the job: a PR resolves the findings it brings in, or nobody reads them.
      # A local commit fails only on the checks `claims.toml`'s `[hook]
      # fail_on_unmarked` lists; the `pre-push` hook in
      # `.pre-commit-config.yaml` runs these checks over the branch first.
      - name: Run the claims checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: PYTHONPATH="$RUNNER_TEMP/claims" python3 -m claims.cli --repo-root . --diff-range "origin/$BASE_REF" --fail-on-unmarked

  docker-integration:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--test cli` for both binaries' end-to-end suites, plus
      # `--test conformance` for the vendored Batect journey projects
      # (ratect-compat/tests/conformance/) — the drop-in-replacement proof —
      # and `--test volume_cleanup`, one daemon-global test kept in its own
      # binary so it runs with exclusive Docker access (see that file).
      # The runner has passwordless sudo and `setpriv`, so a test that runs
      # Ratect as a host user with no passwd entry must run here, not skip
      # (ratect/tests/support/unnamed_host_user.rs).
      - run: cargo test --workspace --test cli --test conformance --test volume_cleanup -- --ignored
        env:
          RATECT_REQUIRE_UNNAMED_HOST_USER: "1"

  # `docs/worked-examples.md` `{{#include}}`s each project's `ratect.toml`/
  # `batect.yml` directly rather than a copy pasted into the doc, so the
  # published config is always exactly what this job runs. It caught a real
  # bug once already: `command` has no shell, so an unwrapped `&&` doesn't
  # error, it just silently drops everything after the first program — a
  # `ratect config validate`/`ratect tasks list`-only check missed that
  # entirely, which is why this actually runs `build`/`test`/`run`/`lint`/`shell`
  # against a real daemon rather than stopping at config validation.
  worked-examples:
    name: Worked Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every example's image is pulled here, all at once and while cargo
      # builds, rather than by each example when its turn comes: one after
      # another, the pulls were most of this job's time (#767). No example
      # sets a pull policy, so each then finds its image already present
      # under the default, `IfNotPresent`. Read from the configs rather than
      # listed here, so a new example or a bumped tag can't be missed. The
      # `curlimages/curl` companion an `external_health_check` generates is
      # in no config, so the run still pulls that one itself.
      - name: Build, pulling every example's image meanwhile
        shell: bash
        run: |
          images=$(sed -nE 's/^[[:space:]]*image[[:space:]]*[=:][[:space:]]*"?([^"[:space:]#]+)"?.*$/\1/p' \
            examples/*/ratect.toml examples/*/batect.yml | sort -u)
          if [ -z "$images" ]; then
            echo "::error::Found no image in any example's config, so this search is broken."
            exit 1
          fi
          pids=()
          for image in $images; do
            docker pull --quiet "$image" &
            pids+=($!)
          done
          cargo build -p ratect -p ratect-compat
          # `wait` returns each pull's own status, so a failed one fails the
          # step under the runner's `bash -e`.
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
      - name: Run build/test/run/lint/shell for every worked example
        shell: bash
        run: |
          # Shared by both the generic loop below and full-stack's own
          # section: run a command, and — unlike a bare exit-code check,
          # which already missed a real bug once (see this job's own
          # comment above) — assert its output actually contains what that
          # task's whole job is to produce, not just that it exited 0.
          assert_output() {
            local label=$1 expected=$2
            shift 2
            local output
            if ! output=$("$@" 2>&1); then
              echo "$output"
              echo "::error::$label failed"
              return 1
            fi
            echo "$output"
            if ! grep -q "$expected" <<< "$output"; then
              echo "::error::$label didn't produce the expected output"
              return 1
            fi
          }
          # Global options (`-f`, here) work before or after the subcommand
          # (ratect-cli.md), so both binaries take the same `-f "$cfg"`
          # placement — only whether a leading `run` subcommand is needed
          # differs, and that's `prefix`, not a second `cmd` body.
          cmd() { "$bin" -f "$cfg" "${prefix[@]}" "$@"; }
          for dir in examples/*/; do
            name=$(basename "$dir")
            # Three aren't one of these, and get their own sections below
            # rather than this generic build/test/run/lint/shell sweep:
            # getting-started's tasks are docs/getting-started.md's own
            # steps, full-stack's names differ too (no bare `test`, and
            # `run` is a long-lived server that never exits on its own), and
            # identity's tasks show who owns what a container writes.
            case "$name" in
              getting-started|full-stack|identity) continue ;;
            esac
            if [ -f "$dir/ratect.toml" ]; then
              bin=./target/debug/ratect
              cfg="$dir/ratect.toml"
              prefix=(run)
            elif [ -f "$dir/batect.yml" ]; then
              bin=./target/debug/ratect-compat
              cfg="$dir/batect.yml"
              prefix=()
            else
              echo "::error::$dir has neither ratect.toml nor batect.yml"
              exit 1
            fi
            echo "::group::$name"
            cmd build
            cmd test
            assert_output "$name's run task" "Hello, world!" cmd run || exit 1
            cmd lint
            # `shell` is interactive by design (ratect-compat-config-reference.md's own
            # Interactive mode) — `-- -c '...'` turns it from "drop into a
            # shell" into "run one command and exit", giving this something
            # real to assert on (the echoed string) instead of just an exit
            # code, and sidestepping needing a real TTY on stdin/stdout for
            # what a bare invocation would otherwise wait to attach to.
            assert_output "$name's shell task" "$name shell ok" cmd shell -- -c "echo $name shell ok" || exit 1
            echo "::endgroup::"
          done

          # docs/getting-started.md's own project — the page includes this
          # config slice by slice and states what each task prints, so each
          # task runs here and its printed line is asserted: `test` twice, for
          # its `build` prerequisite's line and its own; `greet` twice, once
          # with the config-variable override the page says reaches the
          # container.
          echo "::group::getting-started"
          bin=./target/debug/ratect
          cfg=examples/getting-started/ratect.toml
          prefix=(run)
          assert_output "getting-started's hello task" "ratect.toml" cmd hello || exit 1
          assert_output "getting-started's test task (its build prerequisite)" "building..." cmd test || exit 1
          assert_output "getting-started's test task" "testing..." cmd test || exit 1
          assert_output "getting-started's greet task" "hello-world in dev" cmd greet || exit 1
          assert_output "getting-started's greet task with an override" "hello-world in staging" \
            cmd greet --config-var environment_name=staging || exit 1
          echo "::endgroup::"

          # docs/file-ownership.md's project. Its point is who owns what a
          # container writes through a bind mount, which an exit code can't
          # show, so the owner is read from the host after the writes: root
          # without `identity`, and this runner's own uid with it. This
          # runner's daemon is rootful Linux, the one class where those
          # differ.
          echo "::group::identity"
          bin=./target/debug/ratect
          cfg=examples/identity/ratect.toml
          prefix=(run)
          assert_owner() {
            local path=examples/identity/out/$1 expected=$2 actual
            actual=$(stat -c %u "$path") || return 1
            echo "$path is owned by uid $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$path is owned by uid $actual, not $expected"
              return 1
            fi
          }
          cmd write-as-image
          cmd write-as-you
          assert_owner as-image 0 || exit 1
          assert_owner as-image/uid 0 || exit 1
          assert_owner as-you "$(id -u)" || exit 1
          assert_owner as-you/uid "$(id -u)" || exit 1
          # What the page tells a reader stranded with a root-owned directory.
          cmd clean
          if [ -e examples/identity/out/as-image ]; then
            echo "::error::identity's clean task left out/as-image behind"
            exit 1
          fi
          assert_output "identity's show-home task" "HOME:   /home/me" cmd show-home || exit 1
          assert_output "identity's show-home task's passwd home" "passwd: /home/me" cmd show-home || exit 1
          assert_output "identity's show-home-override task" "HOME:   /code" cmd show-home-override || exit 1
          assert_output "identity's show-app-home task" "HOME:   /home/me" cmd show-app-home || exit 1
          # The task writes `prepared` first under `set -e`, so reaching
          # `unprepared` means both were writable.
          assert_output "identity's fill-caches task" "unprepared: written" cmd fill-caches || exit 1
          echo "::endgroup::"

          echo "::group::full-stack"
          cd examples/full-stack
          bin=../../target/debug/ratect
          "$bin" run build -f ratect.toml
          "$bin" run unit-test -f ratect.toml
          "$bin" run lint -f ratect.toml
          # The stack's own end-to-end proof — unlike the other examples'
          # `run`, full-stack's own `run` starts a server that never exits
          # on its own, so it has no place in an assert-and-move-on script.
          assert_output "full-stack's journey-test task" "journey test passed" \
            "$bin" run journey-test -f ratect.toml || exit 1
          assert_output "full-stack's shell task" "full-stack shell ok" \
            "$bin" run shell -f ratect.toml -- -c "echo full-stack shell ok" || exit 1
          echo "::endgroup::"

  dev-env:
    name: Dev-env CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A crude smoke test of ratect-compat itself: run it against its own
      # dogfood batect.yml, so the dev-env/Dockerfile image build, the cache
      # volume mounts, and task execution are all exercised by CI, not just
      # locally. `fmt` specifically, not `build`/`test` — rustfmt needs no
      # compilation, so this stays fast (the Docker named volumes backing
      # `cache` mounts don't persist between CI runs, so a compile-based task
      # here would cold-build the whole workspace on every PR). Whether the
      # workspace actually compiles is already covered, more cheaply, by the
      # Build & Test job above.
      - run: cargo run -p ratect-compat -- fmt

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      # `.cargo/audit.toml` lists RUSTSEC-2023-0071 only because `rsa` 0.9 is
      # in `Cargo.lock` without being compiled (see that entry). This fails if
      # anything compiles it again, when the ignore would hide a real finding.
      # Once `rsa` 0.9 leaves the lockfile, `cargo tree` errors on the
      # unmatched spec and fails this too: remove both then.
      - name: Nothing compiles rsa 0.9
        run: |
          out=$(cargo tree --locked --workspace --all-features -i rsa@0.9 --target all -e normal,dev,build)
          if [ -n "$out" ]; then
            echo "$out"
            echo "rsa 0.9 is compiled again; see .cargo/audit.toml"
            exit 1
          fi

  # ratect#34: catches a broken dist-workspace.toml (or a Cargo.toml version
  # dist can't reconcile — e.g. the two binaries' dev versions disagreeing
  # in a way `dist plan`'s own inference can't paper over) on a normal PR.
  # Does NOT cover release.yml itself: dist-workspace.toml's `allow-dirty =
  # ["ci"]` deliberately turns off the generate-time check that would catch
  # a broken hand-edit there (verified — a deliberately invalid release.yml
  # doesn't fail this job), so its own hand-added jobs remain covered by
  # nothing but review. `dist plan` with no --tag is the same tag-agnostic
  # validity check release.yml's own PR-triggered `plan` job already runs —
  # this duplicate exists so the *same* signal is reported from ci.yml,
  # where a future ruleset change could make it required the way every
  # other job in this file already is (see AGENTS.md's guideline 12); it
  # is in that ruleset itself as Release Pipeline Config, so it blocks a
  # merge, while release.yml's own copy only reports. Deliberately not paths-filtered despite ratect#34's wording:
  # a required check that's skipped on some PRs (via workflow-level
  # `paths:`, the only first-party mechanism) never reports on those PRs
  # and leaves them pending forever — msrv-floor.yml uses paths-filtering
  # precisely because it's declared NOT required for exactly this reason.
  # No taiki-e/install-action entry exists for dist (checked), so this
  # installs it the same way release.yml does — reading the version from
  # dist-workspace.toml rather than a second hardcoded copy, so the two
  # can't drift the way the two `cargo-dist-version = "0.33.0"` occurrences
  # already can (release.yml's own pin and dist-workspace.toml's) — same
  # single-source-of-truth approach msrv-floor.yml already uses for its own
  # pin, including its shape-anchored extraction and empty-value guard.
  dist-plan:
    name: Release Pipeline Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the pinned dist version from dist-workspace.toml
        id: dist-version
        run: |
          version="$(grep -oE '^cargo-dist-version *= *"[0-9][^"]*"' dist-workspace.toml | head -1 | cut -d'"' -f2)"
          echo "version=${version:?could not read cargo-dist-version from dist-workspace.toml}" >> "$GITHUB_OUTPUT"
      - name: Install dist
        env:
          DIST_VERSION: ${{ steps.dist-version.outputs.version }}
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - run: dist plan
