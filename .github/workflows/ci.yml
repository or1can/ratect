name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Every `[`item`]` in a doc comment has to resolve. This repo puts a lot of
  # explanatory prose in doc comments deliberately (decisions/0006), and the
  # cross-references in it are the part that rots: rename or delete an item and
  # every link naming it breaks silently, because neither `cargo build` nor
  # `cargo clippy` reads them. A review caught one by hand; a grep for it
  # missed it, because the link text ends in a backtick before the bracket.
  #
  # Two checks, because one is not enough — an earlier version of this comment
  # called `cargo doc` "the check that can't miss it" and a review then found
  # the half it misses. See the second step, whose own first version was then
  # found to have three holes of its own. Read it before trusting it.
  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Library crates first, then the rest. A cross-crate link (`ratect_core::x`
      # from a binary) only resolves if the target crate's documentation already
      # exists, and one `--workspace` pass documents in whatever order it likes,
      # so seven such links flipped between renders. Two passes make the result
      # the same every time — which the check below needs far more than it needs
      # to be one command.
      - run: cargo doc -p dockerignore -p ratect-core --all-features --no-deps
      - run: cargo doc --workspace --all-features --no-deps
      # `cargo doc -D warnings` catches a link to a name that does not exist.
      # It does *not* catch a link to a name that exists but is not public:
      # rustdoc silently renders `[`x`]` as literal brackets and exits 0, so
      # the reader sees punctuation where a link was meant. No lint covers it
      # — `private_intra_doc_links` does not fire here — which is why this
      # greps the rendered output for the symptom instead of asking the
      # compiler. Restricted to link names this workspace actually writes, so
      # a dependency's own dropped links (inlined into our pages through trait
      # impls) don't fail our build.
      #
      # Paths with `::` are included, not skipped. An earlier version excluded
      # them, claiming the class was "always a bare name" — false:
      # `GitBoundary::check_path_allowed` names a private struct in the same
      # crate. The reason to exclude them was really the render
      # nondeterminism, which the two passes above fix.
      #
      # What this still cannot see, measured by reintroducing one: a link in
      # the doc comment of a *private* item. Those items get no page, so the
      # link never renders and there is no symptom to grep for — which also
      # means no reader of the published documentation ever meets it. Covering
      # them would take `--document-private-items`, i.e. checking pages nobody
      # publishes. Left uncovered on purpose.
      #
      # `shell: bash` for its `pipefail`: the default is `bash -e` without it,
      # and the status of `grep ... | tr | sort` is `sort`'s. A grep matching
      # nothing, or a renamed source directory, would write an empty file, find
      # no overlap, and pass — a gate that silently stops gating. The non-empty
      # assertion is the second half of that: this repo always has doc links, so
      # finding none means the search broke, not that the code got tidy.
      - name: No doc link renders as literal brackets
        shell: bash
        run: |
          grep -rhoE '\[`[A-Za-z_][A-Za-z0-9_:]*`\]' \
            ratect-core/src ratect/src ratect-compat/src dockerignore/src \
            | tr -d '[]`' | sort -u > /tmp/written-links
          for crate in ratect_core ratect ratect_compat dockerignore; do
            [ -d "target/doc/$crate" ] && \
              grep -rho '\[<code>[^<]*</code>\]' "target/doc/$crate" || true
          done | sed 's/\[<code>//; s|</code>\]||' | sort -u > /tmp/dropped-links
          if [ ! -s /tmp/written-links ]; then
            echo "No doc links found at all — this search is broken, not clean."
            exit 1
          fi
          dropped=$(comm -12 /tmp/written-links /tmp/dropped-links)
          if [ -n "$dropped" ]; then
            echo "These doc links resolve to nothing public and render as literal brackets:"
            echo "$dropped"
            echo "Link a public path, or write it as a plain code span."
            exit 1
          fi

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      # `--all-features` turns on ratect-core's `schema` feature, whose tests
      # are what keep the committed schema/batect-config.schema.json in step
      # with the config types it's generated from.
      - run: cargo test --workspace --all-targets --all-features

  tools:
    name: Tools Tests
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: one of these tests loads
      # `verify-docs.py` as it was *before* the two defects it covers and
      # asserts it fails against both. With that revision unreachable it skips
      # itself, which passes — so a shallow clone would quietly retire the one
      # test that shows the file catches anything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `-v` so a skip is visible: skipping is how these stop protecting
      # anything, and a skip is silent in the default output.
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  docker-integration:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--test cli` for both binaries' end-to-end suites, plus
      # `--test conformance` for the vendored Batect journey projects
      # (ratect-compat/tests/conformance/) — the drop-in-replacement proof —
      # and `--test volume_cleanup`, one daemon-global test kept in its own
      # binary so it runs with exclusive Docker access (see that file).
      - run: cargo test --workspace --test cli --test conformance --test volume_cleanup -- --ignored

  dev-env:
    name: Dev-env Rust builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Single source of truth: the Rust version the dogfood build actually
      # runs on lives in dev-env/Dockerfile. Read it here (constrained to a
      # version-like string) rather than duplicating the literal, so the two
      # can't drift. The other jobs deliberately use `stable` (newest); this
      # one pins that exact version so a dependency raising its MSRV above it
      # fails CI instead of silently breaking `ratect-compat -- build`.
      - name: Read the pinned Rust version from dev-env/Dockerfile
        id: rust
        run: |
          version="$(grep -oE 'rust:[0-9]+(\.[0-9]+)*' dev-env/Dockerfile | head -1 | cut -d: -f2)"
          echo "version=${version:?could not read a version from dev-env/Dockerfile}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # The same commands the dogfood batect.yml `build`/`test` tasks run in
      # the rust:<pinned> container — the Docker-requiring tests stay excluded
      # there, so no daemon is needed here either.
      - run: cargo build --workspace
      - run: cargo test --workspace

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
