name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      # `--all-features` turns on ratect-core's `schema` feature, whose tests
      # are what keep the committed schema/batect-config.schema.json in step
      # with the config types it's generated from.
      - run: cargo test --workspace --all-targets --all-features

  tools:
    name: Tools Tests
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: one of these tests loads
      # `verify-docs.py` as it was *before* the two defects it covers and
      # asserts it fails against both. With that revision unreachable it skips
      # itself, which passes — so a shallow clone would quietly retire the one
      # test that shows the file catches anything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `-v` so a skip is visible: skipping is how these stop protecting
      # anything, and a skip is silent in the default output.
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  docker-integration:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--test cli` for both binaries' end-to-end suites, plus
      # `--test conformance` for the vendored Batect journey projects
      # (ratect-compat/tests/conformance/) — the drop-in-replacement proof —
      # and `--test volume_cleanup`, one daemon-global test kept in its own
      # binary so it runs with exclusive Docker access (see that file).
      - run: cargo test --workspace --test cli --test conformance --test volume_cleanup -- --ignored

  dev-env:
    name: Dev-env Rust builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Single source of truth: the Rust version the dogfood build actually
      # runs on lives in dev-env/Dockerfile. Read it here (constrained to a
      # version-like string) rather than duplicating the literal, so the two
      # can't drift. The other jobs deliberately use `stable` (newest); this
      # one pins that exact version so a dependency raising its MSRV above it
      # fails CI instead of silently breaking `ratect-compat -- build`.
      - name: Read the pinned Rust version from dev-env/Dockerfile
        id: rust
        run: |
          version="$(grep -oE 'rust:[0-9]+(\.[0-9]+)*' dev-env/Dockerfile | head -1 | cut -d: -f2)"
          echo "version=${version:?could not read a version from dev-env/Dockerfile}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # The same commands the dogfood batect.yml `build`/`test` tasks run in
      # the rust:<pinned> container — the Docker-requiring tests stay excluded
      # there, so no daemon is needed here either.
      - run: cargo build --workspace
      - run: cargo test --workspace

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
