[workspace]
members = ["ratect", "ratect-compat", "ratect-core", "dockerignore"]
resolver = "2"

# Carries two changes that have both now *merged* upstream but not yet shipped in
# a release: session providers on `build_image`, so one BuildKit build path serves
# secrets/ssh *and* streams build output
# (https://github.com/fussybeaver/bollard/pull/731), and `ping_info`, exposing the
# daemon's advertised default builder
# (https://github.com/fussybeaver/bollard/pull/732). Both are on bollard's `master`
# (0.22.0), whose latest crates.io release is still 0.21.0 — hence the patch. See
# ROADMAP.md's 0.12.0 entry. Cargo.lock pins the exact commit, so builds stay
# reproducible; the branch is kept (rather than tracking upstream `master`) so the
# pin doesn't drag in unrelated post-merge work. Drop this patch entirely once
# bollard 0.22 is published.
[patch.crates-io]
bollard = { git = "https://github.com/or1can/bollard.git", branch = "feat/build-image-session-providers" }
