[workspace]
members = ["ratect", "ratect-compat", "ratect-core", "dockerignore"]
resolver = "2"

# Upstream `master` plus one small fix of ours that hasn't landed yet:
# `connect_with_ssl` no longer discards every certificate that loaded from the
# OS trust store just because *some* entry in it errored — see `docker/
# connection.rs`'s own module doc for the user-facing failure this caused. Raised
# upstream as https://github.com/fussybeaver/bollard/pull/796. Ratect itself no
# longer reaches `connect_with_ssl` at all — not directly, and not through
# `connect_with_host` either (ratect#257) — so nothing here depends on that fix
# any more; it stays on the branch only until upstream takes or declines it,
# and dropping it changes nothing for Ratect. Sshforward dispatch
# to *named* ssh agents (which `build_ssh`'s multi-agent and `paths` support is
# built on, decisions/0005), session providers on `build_image`, and `ping_info`
# were on this branch too, but all three landed upstream (PRs #770, #731, #732)
# and are dropped here as of the 2026-09-04 rebase — this pin is `master` plus
# only the still-unlanded native-certs fix. The one thing keeping this patch in
# place at all: the latest crates.io release is still 0.21.1 (checked via `cargo
# search bollard`), so none of upstream's merges are reachable from a plain
# version dependency yet. See ROADMAP.md's 0.12.0 entry.
#
# The branch is cut fresh from upstream `master` on every rebase, not carried
# forward from an old PR branch: upstream squash-merges on review, so an old
# branch and master end up expressing the same landed feature as different
# commits touching the same lines, which conflicts on comparison and makes the
# branch unable to raise a PR or pick up later upstream fixes. Keep this pin on
# a branch that is `master` + our own unlanded commits, and rebase it rather
# than merging master into it — worth catching up whenever this file is
# touched and the branch has drifted, dropping any commit that has landed
# upstream since, rather than folding that into an unrelated change.
#
# Cargo.lock pins the exact commit, so builds stay reproducible. Dropping this
# patch entirely still needs a new crates.io release with today's `master`.
#
# `noyalib`: upstream's in-flight release branch (`feat/v0.0.58`, still versioned
# 0.0.57 until it ships) plus one fix of ours: an unknown or missing field
# rejected by `from_str` now carries its line, column and field path like every
# other typed rejection, which is what lets a config load error name where the
# bad entry is (ratect#415). Raised upstream as
# https://github.com/sebastienrousseau/noyalib/pull/482; upstream releases
# roughly daily, so drop this pin — and bump `ratect-core`'s `noyalib` version —
# as soon as a crates.io release contains it. A Renovate bump past 0.0.57 makes
# cargo ignore this patch (the fork stays versioned 0.0.57) with only a warning:
# if that release lacks the fix, the error-location tests in `config_tests` and
# `ratect-compat`'s `unsupported_config_key_reports_error` fail; if it has it,
# delete this entry in that same PR. Same branch rules as `bollard`'s
# above: cut from upstream's in-flight release branch, rebased never merged into.
[patch.crates-io]
bollard = { git = "https://github.com/or1can/bollard.git", branch = "fix/native-certs-partial-load" }
noyalib = { git = "https://github.com/or1can/noyalib.git", branch = "fix/locate-unknown-and-missing-field" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
