# ANCHOR: homepage-demo
project_name = "ratect-full-stack"

[containers.app]
image = "node:22"
working_directory = "/code"
enable_init_process = true
ports = [{ local = 8080, container = 8080 }]
environment = { DATABASE_URL = "postgres://postgres@db:5432/postgres", REDIS_URL = "redis://cache:6379" }
volumes = [
    { local = "app", container = "/code" },
    { type = "cache", name = "full-stack-npm-cache", container = "/root/.npm" },
]
# Not just for `run` — `app` cannot even start without both (it connects to
# `cache` at module load, and `db` on its first request), so this belongs
# on the container itself rather than repeated on every task that uses it.
dependencies = ["db", "cache"]
command = "sh -c 'npm ci && npm start'"
# Checked from outside, over the project's own network, instead of by the
# `node -e` one-liner this used to be — escaping quotes inside a TOML string
# to make a single HTTP request. `node:22` is a full Debian image and could
# run that check itself; the field exists for images that can't (distroless,
# `scratch`), and is used here because the declarative form says what is
# actually meant. Nothing runs inside `app` to prove it is ready.
[containers.app.external_health_check]
type = "http"
port = 8080
path = "/healthz"
interval = "1s"
retries = 20

# ANCHOR: readiness-db
[containers.db]
image = "postgres:16"
environment = { POSTGRES_HOST_AUTH_METHOD = "trust" }
volumes = [{ local = "db/init", container = "/docker-entrypoint-initdb.d" }]
health_check = { command = "pg_isready -h 127.0.0.1 -U postgres", interval = "1s", retries = 90 }
# ANALYZE needs a real, committed table to work against, which is exactly
# what setup_commands is for — running once db is healthy, not baked into
# the init script that creates and seeds that table in the first place.
# Genuinely useful here, not just illustrative: a bulk INSERT this size
# leaves the query planner without fresh statistics until something
# collects them, and the journey-test/app queries below count() this table.
setup_commands = [
    { command = "psql -U postgres -c \"ANALYZE visits;\"" },
]
# ANCHOR_END: readiness-db

[containers.cache]
image = "redis:7"
health_check = { command = "redis-cli ping", interval = "1s", retries = 10 }

[containers.journey-test]
image = "node:22"
working_directory = "/code"
environment = { REDIS_URL = "redis://cache:6379" }
volumes = [
    { local = "journey-test", container = "/code" },
    { type = "cache", name = "full-stack-npm-cache", container = "/root/.npm" },
]
command = "sh -c 'npm ci && node test.js'"
# ANCHOR_END: homepage-demo

# The same image as `app`, without the stack's runtime wiring: `app` carries
# `dependencies` on `db`/`cache` and publishes 8080, so a one-shot `npm ci`
# run there would start Postgres and Redis and take the port for nothing.
# `build`/`unit-test`/`lint`/`shell` run here instead.
#
# It used to be a health-check race as well — `app`'s old in-container
# `health_check` gated *any* task run in that container, including a
# `npm ci` that exits long before port 8080 serves anything. An
# `external_health_check` doesn't: nothing waits on a task's own container
# becoming ready, because running it is the task.
[containers.dev]
image = "node:22"
working_directory = "/code"
volumes = [
    { local = "app", container = "/code" },
    { type = "cache", name = "full-stack-npm-cache", container = "/root/.npm" },
]

[tasks.build]
description = "Install app dependencies"
group = "Development"
run = { container = "dev", command = "sh -c 'npm ci'" }

[tasks.unit-test]
description = "Run fast unit tests (no live dependencies)"
group = "Development"
run = { container = "dev", command = "sh -c 'npm ci && npm test'" }

[tasks.run]
description = "Start the app and its dependencies (db, cache)"
group = "Development"
run = { container = "app" }

# ANCHOR: homepage-demo-task
[tasks.journey-test]
description = "Exercise the running app end to end, sharing `cache` with `app`"
group = "Development"
dependencies = ["app", "cache"]
run = { container = "journey-test" }
# ANCHOR_END: homepage-demo-task

[tasks.lint]
description = "Run eslint"
group = "Checks"
run = { container = "dev", command = "sh -c 'npm ci && npm run lint'" }

# ANCHOR: shell
[tasks.shell]
description = "Start a shell in the app's environment"
group = "Utilities"
run = { container = "dev", command = "bash" }
# ANCHOR_END: shell
