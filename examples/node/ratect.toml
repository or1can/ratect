project_name = "example-node"

[containers.build-env]
image = "node:22"
working_directory = "/code"
volumes = [
    { local = ".", container = "/code" },
    { type = "cache", name = "npm-cache", container = "/root/.npm" },
]

[tasks.build]
description = "Compile TypeScript"
group = "Development"
run = { container = "build-env", command = "sh -c 'npm ci && npm run build'" }

[tasks.test]
description = "Run the test suite"
group = "Development"
run = { container = "build-env", command = "sh -c 'npm ci && npm test'" }

[tasks.lint]
description = "Run eslint"
group = "Checks"
run = { container = "build-env", command = "sh -c 'npm ci && npm run lint'" }
