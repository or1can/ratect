project_name: example-jvm

containers:
  build-env:
    image: eclipse-temurin:21-jdk
    working_directory: /code
    volumes:
      - local: .
        container: /code
      - type: cache
        name: gradle-cache
        container: /root/.gradle

tasks:
  build:
    description: Compile and assemble
    group: Development
    run:
      container: build-env
      command: ./gradlew assemble

  test:
    description: Run the test suite
    group: Development
    run:
      container: build-env
      command: ./gradlew test

  run:
    description: Run the application
    group: Development
    run:
      container: build-env
      command: ./gradlew run

  lint:
    description: Run Checkstyle
    group: Checks
    run:
      container: build-env
      command: ./gradlew checkstyleMain checkstyleTest

  shell:
    description: Start a shell in the build environment
    group: Utilities
    run:
      container: build-env
      command: bash
