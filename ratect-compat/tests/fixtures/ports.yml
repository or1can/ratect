# Exercises `ports` (publishing a container port to the host) and
# `--disable-ports`. `server`/`server-disabled-check`/`server-two-host-ports`
# are separate containers on separate host ports so the real-Docker tests
# that use this fixture can run concurrently without colliding.
# `server-two-host-ports` publishes its one container port on two host
# ports, which must both be bound (ratect#291).
#
# nginx:alpine's default command serves on port 80 with no configuration
# needed — Container has no `command` field for dependencies, so a
# dependency always runs its image's default command.
project_name: ratect-ports-test
containers:
  server:
    image: nginx:alpine
    ports:
      - "18080:80"
  app:
    image: alpine:3.18.2
    dependencies:
      - server
  server-disabled-check:
    image: nginx:alpine
    ports:
      - "18081:80"
  app-disabled-check:
    image: alpine:3.18.2
    dependencies:
      - server-disabled-check
  server-two-host-ports:
    image: nginx:alpine
    ports:
      - "18082:80"
      - "18083:80"
  app-two-host-ports:
    image: alpine:3.18.2
    dependencies:
      - server-two-host-ports
tasks:
  serve:
    run:
      container: app
      # A short-lived delay, purely to give the host-side test a window to
      # reach the published port before ratect tears everything down.
      command: sleep 5
  serve-for-disabled-check:
    run:
      container: app-disabled-check
      command: sleep 5
  serve-on-two-host-ports:
    run:
      container: app-two-host-ports
      command: sleep 5
