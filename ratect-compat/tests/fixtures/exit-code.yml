# Exercises container exit code propagation: `succeeds` and `fails` prove
# ratect fails the process (with the exact exit code) when the task's own
# command exits non-zero, `stops-prerequisite-chain` proves a failing
# prerequisite stops the rest of the chain from running at all, and
# `fails-after-prerequisite` proves a run whose prerequisite succeeds exits
# with the main task's code, not the prerequisite's. `unpullable` is the
# contrast: a failure of Ratect's own (`125`), reported as an `Error:` line
# where a task's own exit never is.
project_name: ratect-exit-code-test
containers:
  build-env:
    image: alpine:3.18.2
  unpullable:
    image: ratect-exit-code-test.invalid/nope:does-not-exist
tasks:
  unpullable:
    run:
      container: unpullable
      command: echo unreachable
  succeeds:
    run:
      container: build-env
      command: sh -c "exit 0"
  fails:
    run:
      container: build-env
      command: sh -c "exit 42"
  stops-prerequisite-chain:
    prerequisites:
      - fails
    run:
      container: build-env
      command: echo "should never print this"
  fails-after-prerequisite:
    prerequisites:
      - succeeds
    run:
      container: build-env
      command: sh -c "exit 42"
