# Proves a `build_secrets` entry with `path` reaches a real BuildKit build,
# as Batect's file-backed build secret does (ratect#520): the Dockerfile's
# `RUN --mount=type=secret,id=token` copies the secret into the image, and
# the task cats that copy, which must be exactly `build-secrets-file/token.txt`
# (the path is relative to this file). `build-secrets.yml` is the same for an
# `environment` secret — but not the same Dockerfile: BuildKit merges
# identical steps of builds running at once, a secret's value not being part
# of what makes them identical, so two such builds could each read the
# other's secret.
project_name: ratect-build-secrets-file-test
containers:
  build-env:
    build_directory: ./build-secrets-file
    build_secrets:
      token:
        path: ./build-secrets-file/token.txt
tasks:
  print-secret:
    run:
      container: build-env
      command: cat /file-secret-out.txt
