# This repo's own config for the `claims` plugin (replaces
# tools/echoed-claims.py, tools/spliced-docs.py, tools/stale-claims.py and
# tools/verify-docs.py — see decisions/0009-adopt-claims-plugin.md for the
# migration). Full knob reference: the plugin's own docs/configuration.md.

[stale-claims]
# A bare backtick name (`` `cache` ``, no extension) is ambiguous — as often
# an ordinary English/config-field word as a module reference — so only
# trust it as one where this repo actually discusses modules by name.
# Everywhere else (docs/ especially) the same words mean a YAML/TOML field
# or a CLI concept instead. An extension-qualified citation (`` `cache.rs` ``)
# or an explicit relative path always counts, regardless of this list.
module_reference_scope = ["decisions/*.md", "AGENTS.md"]

# CHANGELOG.md/RELEASES.md/decisions/*.md are this repo's own append-only
# historical records (AGENTS.md's own rules) — they legitimately cite a path
# as it existed when that entry was written, even after a later refactor
# renames or deletes it. Excluded rather than fixed, since "fixing" one would
# mean rewriting history these files are explicitly meant never to rewrite.
#
# The other false positives this check used to hit here (a `~`/`/`-prefixed
# path outside the repo, and two hypothetical/template filenames in
# AGENTS.md and docs/ratect-compat-config-reference.md) no longer need a file-wide
# exclusion: claims#37 fixed the home/absolute-path case, and the
# `<!-- example -->` inline marker (claims#39) covers the other two
# in-place, right next to each mention.
[check-file-refs]
exclude = [
    "CHANGELOG.md",
    "RELEASES.md",
    "decisions/*.md",
]

# The same three files, for `check-links` — but *not* excluded, since a
# changelog's Unreleased section is live and its links should still gate.
# `historical` instead holds a shipped entry's link to the tree as of the
# commit that wrote it (the plugin's ADR 0002): a docs page can be renamed
# or split without editing an entry that links to it, and the rename
# commit still has to fix every link from a living page. Needs claims
# 0.10.0 (or1can/claims#51); an older plugin ignores the key, so this is
# harmless until `claude plugin update` picks that up.
[check-links]
historical = [
    "CHANGELOG.md",
    "RELEASES.md",
    "decisions/*.md",
]

[restatement]
# `echoed-claims.py` only ever scanned `.md`. Most of this repo's prose lives
# in Rust `//!`/`///` doc comments instead (decisions/0006's whole point), so
# without `.rs` here the check would miss the exact case it exists for: a
# corrected claim in a doc comment whose stale twin survives in a Markdown
# page, or vice versa.
extensions = [".rs"]

[executable-claims]
# A cold `target/` dir (no incremental build cache — the first `cargo run`
# in a fresh checkout, or right after `cargo clean`) has taken ~96s for this
# repo's own `<!-- verify: -->` marker, well past the default 30s. A timeout
# is advisory rather than gate (claims#8), so raising this only avoids noise
# on a cold build, not a false gate failure.
timeout = 120

[claim-words]
# Opt-in only (spec.md's "designated record-like files") — nothing is swept
# unless listed here. These are this repo's own claim-bearing, prose-heavy
# surfaces: contributor process docs, the domain glossary, ADRs, and
# user-facing docs. Diff-scoped, so this only ever looks at lines a commit
# adds.
files = [
    "AGENTS.md",
    # The per-task process references AGENTS.md points at (decisions/0007):
    # the same kind of prose, just loaded on demand rather than every session.
    "agents/*.md",
    "CONTEXT.md",
    "ROADMAP.md",
    "RELEASES.md",
    "TODO.md",
    "decisions/*.md",
    # Matched with fnmatch, not a path-aware glob — `**` has no recursive
    # meaning there, just two flat wildcards either side of a literal `/`.
    # Every Markdown page sits directly under docs/ (docs/captures/ holds
    # only .ansi captures), so that plain form is what actually matches;
    # verified empirically that "docs/**/*.md" matches none of the real
    # files here. Add "docs/**/*.md" back alongside this if a Markdown
    # page ever lands in a subdirectory of docs/ — neither form alone
    # covers both a flat and a nested layout under this matcher.
    "docs/*.md",
]
