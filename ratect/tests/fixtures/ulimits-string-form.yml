# A YAML fragment included by `ulimits.toml` — a native project pulling in a
# `.yml` file, which is the one place Docker's own compact
# `"name=soft:hard"` ulimit string is meant to be written (the native format
# and its schema treat the object form as canonical). Proves the parser
# really does accept the shorthand there.
containers:
  string-form:
    image: alpine:3.18.2
    ulimits:
      - nofile=1234:5678
    command: sh -c 'test $(ulimit -Sn) -eq 1234 && test $(ulimit -Hn) -eq 5678 && echo string-form-ok'

tasks:
  string-form:
    description: A container whose ulimits are written in Docker's compact string form
    run:
      container: string-form
