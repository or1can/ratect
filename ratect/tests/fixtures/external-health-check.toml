# A native `ratect.toml` fixture proving `external_health_check` (ratect#98)
# against a real Docker daemon. Native-only — Batect has no equivalent, so
# this fixture, unlike most engine/Docker behaviour proven under
# `ratect-compat/tests/fixtures/`, can only be expressed here (see AGENTS.md's
# fixture-layer guideline).
#
# `traefik/whoami` is the point of the fixture, not an arbitrary web server:
# it is a `scratch`-based image with no shell and no HTTP client of its own,
# so `docker exec`ing a check into it is impossible and an in-container
# `health_check` could never be written for it. Anything that becomes ready
# here did so from outside, over the project's own network, with nothing at
# all having run inside the checked container for it — the one image that
# adds a `HEALTHCHECK` of its own is there to prove that isn't waited on.
project_name = "ratect-external-health-check-test"

[containers.api]
image = "traefik/whoami:v1.10.2"
[containers.api.external_health_check]
type = "http"
port = 80
path = "/health"
interval = "1s"
retries = 20
timeout = "2s"

[containers.socket]
image = "traefik/whoami:v1.10.2"
[containers.socket.external_health_check]
type = "tcp"
port = 80
interval = "1s"
retries = 20

# Port 9999 is not listened on, so this check exhausts its (deliberately
# small) retry budget and exits non-zero.
[containers.unreachable]
image = "traefik/whoami:v1.10.2"
[containers.unreachable.external_health_check]
type = "tcp"
port = 9999
interval = "1s"
retries = 2

# An image whose own `HEALTHCHECK` always fails (see its Dockerfile). The
# external check alone decides readiness (ratect#269), so this is ready once
# the check passes, and Docker's verdict is never waited on.
[containers.api-with-failing-image-healthcheck]
build_directory = "external-health-check-image"
[containers.api-with-failing-image-healthcheck.external_health_check]
type = "tcp"
port = 80
interval = "1s"
retries = 20

[containers.app]
image = "alpine:3.18.2"
dependencies = ["api", "socket"]

[containers.app-with-failing-image-healthcheck]
image = "alpine:3.18.2"
dependencies = ["api-with-failing-image-healthcheck"]

[containers.app-with-unreachable-dependency]
image = "alpine:3.18.2"
dependencies = ["unreachable"]

[tasks.start]
description = "Runs once both external health checks have passed"
run = { container = "app", command = "echo app-started" }

[tasks.start-with-unreachable-dependency]
description = "Must fail before its container ever runs"
run = { container = "app-with-unreachable-dependency", command = "echo should-not-run" }

[tasks.start-despite-failing-image-healthcheck]
description = "Runs once the external check passes, whatever the image's own HEALTHCHECK says"
run = { container = "app-with-failing-image-healthcheck", command = "echo app-started" }
